<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report Lost Item – TraceHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>
  <!-- COMMIT 5: added landing-style.css -->
  <link rel="stylesheet" href="css/landing-style.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>

  <header>
    <nav class="top-nav dark">
      <div class="brand"><a href="main.html">TRACEHUB</a></div>
      <div class="nav-links">
        <a href="main.html" class="nav-text-link">Main Page</a>
        <a href="#" onclick="logout()" class="nav-text-link">Logout</a>
      </div>
    </nav>
  </header>

  <main class="container" style="max-width: 640px; margin-top: 40px;">
    <div class="card z-depth-2">
      <div class="card-content">
        <h5 style="font-family: var(--serif); color: var(--ink);"><b>Report Lost Item</b></h5>
        <p style="color: var(--ink-muted);">Fill in the details below to report an item.</p>

        <div class="input-field">
          <input type="text" id="title" />
          <label for="title">Item Title</label>
          <span class="helper-text" style="color: var(--danger);" id="titleError"></span>
        </div>

        <div class="input-field">
          <select id="category">
            <option value="" disabled selected>Choose a category</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Keys">Keys</option>
            <option value="Wallet">Wallet</option>
            <option value="Bag">Bag</option>
            <option value="Documents">Documents</option>
            <option value="Jewellery">Jewellery</option>
            <option value="Other">Other</option>
          </select>
          <label>Category</label>
          <span class="helper-text" style="color: var(--danger);" id="categoryError"></span>
        </div>

        <div class="input-field">
          <textarea id="description" class="materialize-textarea"></textarea>
          <label for="description">Description</label>
          <span class="helper-text" style="color: var(--danger);" id="descriptionError"></span>
        </div>

        <div class="input-field">
          <input type="date" id="dateLost" />
          <label for="dateLost" class="active">Date Lost</label>
          <span class="helper-text" style="color: var(--danger);" id="dateError"></span>
        </div>

        <div class="input-field">
          <input type="text" id="location" />
          <label for="location">Location Lost</label>
          <span class="helper-text" style="color: var(--danger);" id="locationError"></span>
        </div>

        <div class="file-field input-field">
          <div class="btn btn-gold">
            <span>Photo</span>
            <input type="file" id="photo" accept=".jpg,.jpeg,.png" />
          </div>
          <div class="file-path-wrapper">
            <input class="file-path validate" type="text" placeholder="Optional – JPG or PNG only" />
          </div>
          <span class="helper-text" style="color: var(--danger);" id="photoError"></span>
        </div>

        <span style="color: var(--danger);"  id="formError"></span>
        <span style="color: var(--gold-dark);" id="formSuccess"></span>

        <button class="btn btn-primary full-width mt-10" onclick="handleReportLost()">
          Submit Lost Item
        </button>

        <div class="submitted-preview hide" id="submittedPreview">
          <h6 style="color: var(--gold-dark);"><b>Submitted item</b></h6>
          <p><b>Title:</b> <span id="previewTitle"></span></p>
          <p><b>Category:</b> <span id="previewCategory"></span></p>
          <p><b>Date lost:</b> <span id="previewDate"></span></p>
          <p><b>Location:</b> <span id="previewLocation"></span></p>
          <p><b>Description:</b> <span id="previewDescription"></span></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/lostItems.js"></script>
</body>
</html>
