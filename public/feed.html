<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home &mdash; TraceHub</title>
</head>
<body>

  <div class="mobile-bar">
    <button class="menu-toggle">&#9776;</button>
    <div class="brand">TRACEHUB</div>
    <span></span>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="index.html">TRACEHUB</a>
      <nav>
        <ul>
          <li><a href="feed.html" class="active"><span class="icon">H</span>Home</a></li>
          <li><a href="search.html"><span class="icon">S</span>Search</a></li>
          <li><a href="notifications.html"><span class="icon">N</span>Notifications</a></li>
          <li><a href="messages.html"><span class="icon">M</span>Messages</a></li>
          <li><a href="profile.html"><span class="icon">P</span>Profile</a></li>
          <li><a href="#"><span class="icon">&#9881;</span>Settings</a></li>
          <li><a href="index.html"><span class="icon">L</span>Logout</a></li>
        </ul>
      </nav>
      <button class="btn post-cta">+ New Post</button>
      <div class="me">
        <div class="avatar sm">M</div>
        <div>
          <div class="name">Me</div>
          <div class="handle">@me</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <h1 class="page-title">Home <em>Feed</em></h1>
      <p class="page-sub">The latest from your community</p>

      <div class="compose">
        <div class="avatar">M</div>
        <div>
          <textarea class="textarea" placeholder="Describe what you lost or found..."></textarea>
          <div class="compose-actions">
            <div class="compose-icons">
              <span class="compose-chip">+ Photo</span>
              <span class="compose-chip">+ Location</span>
              <span class="compose-chip">+ Date</span>
            </div>
            <button class="btn btn-primary">Post</button>
          </div>
        </div>
      </div>

      

    </main>
  </div>

</body>
</html>
