<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report Found Item - TRACE HUB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>
  <link rel="stylesheet" href="css/landing-style.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="grey lighten-4">

  <nav class="teal">
    <div class="nav-wrapper container">
      <a href="main.html" class="brand-logo">TRACE HUB</a>
      <ul id="nav-mobile" class="right">
        <li><a href="main.html">Main Page</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </nav>

  <main class="container" style="max-width: 640px; margin-top: 40px;">
    <div class="card z-depth-2">
      <div class="card-content">
        <h5 class="teal-text"><b>Report Found Item</b></h5>
        <p class="grey-text">Fill in the details below to report an item you found.</p>

        <div class="input-field">
          <input type="text" id="title" />
          <label for="title">Item Title</label>
          <span class="helper-text red-text" id="titleError"></span>
        </div>

        <div class="input-field">
          <select id="category">
            <option value="" disabled selected>Choose a category</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Keys">Keys</option>
            <option value="Wallet">Wallet</option>
            <option value="Bag">Bag</option>
            <option value="Documents">Documents</option>
            <option value="Jewellery">Jewellery</option>
            <option value="Other">Other</option>
          </select>
          <label>Category</label>
          <span class="helper-text red-text" id="categoryError"></span>
        </div>

        <div class="input-field">
          <textarea id="description" class="materialize-textarea"></textarea>
          <label for="description">Description</label>
          <span class="helper-text red-text" id="descriptionError"></span>
        </div>

        <div class="input-field">
          <input type="date" id="dateFound" />
          <label for="dateFound" class="active">Date Found</label>
          <span class="helper-text red-text" id="dateError"></span>
        </div>

        <div class="input-field">
          <input type="text" id="location" />
          <label for="location">Location Found</label>
          <span class="helper-text red-text" id="locationError"></span>
        </div>

        <div class="file-field input-field">
          <div class="btn teal">
            <span>Photo</span>
            <input type="file" id="photo" accept=".jpg,.jpeg,.png" />
          </div>
          <div class="file-path-wrapper">
            <input class="file-path validate" type="text" placeholder="Optional - JPG or PNG only" />
          </div>
          <span class="helper-text red-text" id="photoError"></span>
        </div>

        <span class="red-text" id="formError"></span>
        <span class="green-text" id="formSuccess"></span>

        <button class="btn teal waves-effect waves-light full-width mt-10" onclick="handleReportFound()">
          Submit Found Item
        </button>

        <div class="submitted-preview hide" id="submittedPreview">
          <h6 class="teal-text"><b>Submitted found item</b></h6>
          <p><b>Title:</b> <span id="previewTitle"></span></p>
          <p><b>Category:</b> <span id="previewCategory"></span></p>
          <p><b>Date found:</b> <span id="previewDate"></span></p>
          <p><b>Location:</b> <span id="previewLocation"></span></p>
          <p><b>Description:</b> <span id="previewDescription"></span></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/foundItems.js"></script>
</body>
</html>
