<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – ILFS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>
  <link rel="stylesheet" href="css/landing-style.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
 
  <header>
    <nav class="top-nav dark">
      <div class="brand"><a href="index.html">TRACEHUB</a></div>
      <div class="nav-links">
        <div id="navbar-container"></div>
      </div>
    </nav>
  </header>
 
  <div class="container" style="max-width: 480px; margin-top: 60px;">
    <div class="card z-depth-2">
      <div class="card-content">
        <h5 class="center-align" style="font-family: var(--serif); color: var(--ink);"><b>TRACEHUB</b></h5>
        <p class="center-align" style="color: var(--ink-muted);">Login to your account</p>
 
        <div class="input-field">
          <input type="email" id="email" />
          <label for="email">Email</label>
          <span class="helper-text" style="color: var(--danger);" id="emailError"></span>
        </div>
 
        <div class="input-field">
          <input type="password" id="password" />
          <label for="password">Password</label>
          <span class="helper-text" style="color: var(--danger);" id="passwordError"></span>
        </div>
 
        <span style="color: var(--danger);" id="loginError"></span>

         <button class="btn btn-primary full-width mt-10" onclick="handleLogin()">
          Login
        </button>
 
        <p class="center-align mt-10">
          Don't have an account? <a href="register.html" style="color: var(--gold-dark);">Register here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
