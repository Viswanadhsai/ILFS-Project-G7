<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Dashboard – TraceHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/user-dashboard.css"/>
</head>
<body>

  <header>
    <nav class="top-nav dark">
      <div class="brand"><a href="main.html">TRACEHUB</a></div>
      <div class="nav-links">
        <a href="main.html" class="nav-text-link">Main Page</a>
        <a href="notifications.html" class="nav-text-link">Notifications</a>
        <a href="chat.html" class="btn btn-ghost-light">Messages</a>
      </div>
    </nav>
  </header>

  <main class="dash-page">
    <div class="dash-container">

      <aside class="dash-sidebar">

        <div class="dash-profile-card">
          <div class="dash-avatar" id="dashAvatar">?</div>
          <div class="dash-profile-name" id="dashName">Loading…</div>
          <div class="dash-profile-username" id="dashUsername"></div>
          <div class="dash-profile-email" id="dashEmail"></div>
          <div class="dash-profile-role" id="dashRole">Member</div>

          <div class="dash-stats">
            <div class="dash-stat">
              <span class="dash-stat-num" id="statLost">0</span>
              <span class="dash-stat-label">Lost</span>
            </div>
            <div class="dash-stat-divider"></div>
            <div class="dash-stat">
              <span class="dash-stat-num" id="statFound">0</span>
              <span class="dash-stat-label">Found</span>
            </div>
            <div class="dash-stat-divider"></div>
            <div class="dash-stat">
              <span class="dash-stat-num" id="statResolved">0</span>
              <span class="dash-stat-label">Resolved</span>
            </div>
          </div>

          <div class="dash-card-actions">
            <button class="btn btn-gold full-w" onclick="logout()">Logout</button>
          </div>
        </div>

        <div class="dash-quick-nav">
          <button class="dash-qnav-btn active" onclick="showSection('account', this)">Account Settings</button>
          <button class="dash-qnav-btn" onclick="showSection('lost', this)">My Lost Items</button>
          <button class="dash-qnav-btn" onclick="showSection('found', this)">My Found Items</button>
          <button class="dash-qnav-btn" onclick="showSection('matches', this)">My Matches</button>
        </div>

      </aside>

      <div class="dash-content"></div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="brand">TRACEHUB</div>
    <div style="margin-top:8px;">&copy; 2026 TraceHub Project &middot; <a href="#">About</a> &middot; <a href="#">Contact</a></div>
  </footer>

  <script src="js/user-dashboard.js"></script>
</body>
</html>
