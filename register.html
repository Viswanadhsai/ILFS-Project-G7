<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – ILFS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="grey lighten-4">

  <div class="container" style="max-width: 480px; margin-top: 80px;">
    <div class="card z-depth-3">
      <div class="card-content">
        <h5 class="center-align teal-text"><b>Create an Account</b></h5>
        <p class="center-align grey-text">Join the Intelligent Lost & Found System</p>

        <div class="input-field">
          <input type="text" id="name" />
          <label for="name">Full Name</label>
          <span class="helper-text red-text" id="nameError"></span>
        </div>

        <div class="input-field">
          <input type="email" id="email" />
          <label for="email">Email</label>
          <span class="helper-text red-text" id="emailError"></span>
        </div>

        <div class="input-field">
          <input type="password" id="password" />
          <label for="password">Password</label>
          <span class="helper-text red-text" id="passwordError"></span>
        </div>

        <div class="input-field">
          <input type="password" id="confirmPassword" />
          <label for="confirmPassword">Confirm Password</label>
          <span class="helper-text red-text" id="confirmError"></span>
        </div>

        <span class="red-text" id="registerError"></span>

        <button class="btn teal waves-effect waves-light full-width mt-10" onclick="handleRegister()">
          Register
        </button>

        <p class="center-align mt-10">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
